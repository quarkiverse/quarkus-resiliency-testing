# Host the SOAP service in the test application
quarkus.cxf.path=/soap
quarkus.cxf.endpoint."/hello".implementor=io.quarkiverse.resiliencytesting.it.cxf.SoapEndpoint

# Quarkus test HTTP port
quarkus.http.test-port=8081

# Payments SOAP client
quarkus.cxf.client.payments.service-interface=io.quarkiverse.resiliencytesting.it.cxf.SoapService
quarkus.cxf.client.payments.client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/hello
quarkus.cxf.client.payments.receive-timeout=1000

# Orders SOAP client
quarkus.cxf.client.orders.service-interface=io.quarkiverse.resiliencytesting.it.cxf.SoapService
quarkus.cxf.client.orders.client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/hello
quarkus.cxf.client.orders.receive-timeout=1000
quarkus.cxf.client.orders.alternative=true

# Receipts SOAP client with different default URL endpoint
quarkus.cxf.client.receipts.service-interface=io.quarkiverse.resiliencytesting.it.cxf.SoapService
quarkus.cxf.client.receipts.client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/hello/receipts
quarkus.cxf.client.receipts.receive-timeout=1000
quarkus.cxf.client.receipts.alternative=true

# Default endpoint SOAP client
quarkus.cxf.client.default-endpoint.service-interface=io.quarkiverse.resiliencytesting.it.cxf.SoapService
quarkus.cxf.client.default-endpoint.receive-timeout=1000
quarkus.cxf.client.default-endpoint.alternative=true

# CXF client with inferred service interface
quarkus.cxf.client.inferred-interface.client-endpoint-url=http://localhost:${quarkus.http.test-port}/soap/hello
quarkus.cxf.client.inferred-interface.receive-timeout=1000
quarkus.cxf.client.inferred-interface.alternative=true

# Inferred interface without default endpoint SOAP client
quarkus.cxf.client.inferred-interface-default-endpoint.receive-timeout=1000
quarkus.cxf.client.inferred-interface-default-endpoint.alternative=true

# SOAP Client without name qualifier and default endpoint
quarkus.cxf.client.noname.service-interface=io.quarkiverse.resiliencytesting.it.cxf.SoapService
quarkus.cxf.client.noname.receive-timeout=1000
quarkus.cxf.client.noname.alternative=true

# Useful debugging logs
quarkus.log.category."io.quarkiverse.resiliencytesting".level=DEBUG
